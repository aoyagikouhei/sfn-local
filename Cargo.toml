[package]
name = "sfn-local"
version = "0.1.0"
edition = "2024"
description = "Local stand-in for the AWS Step Functions API"
repository = "https://github.com/aoyagikouhei/sfn-local"
publish = false

[dependencies]
axum = "0.8.9"
# TLS は入れない（Lambda の Invoke API にはローカルの素の HTTP でつなぐ）。
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
